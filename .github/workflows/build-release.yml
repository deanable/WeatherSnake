name: Build & Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -r requirements.txt

    - name: Run tests
      run: pytest test_processing.py test_insights.py -q

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # Two macOS builds, because no single binary can cover all Macs:
          # - Intel x86_64 on an Intel runner, for macOS 10.15 (Catalina) —
          #   the oldest macOS we support, which only exists on Intel Macs —
          #   and newer Intel Macs. (Apple silicon Macs can also run this
          #   build via Rosetta 2.)
          # - Native arm64 on an Apple silicon runner, for M1+ Macs. arm64
          #   needs macOS 11.0, the first release that runs on Apple silicon.
          #   A single universal2 DMG is not possible: the PyPI wheels for
          #   numpy/pandas/matplotlib are single-arch only.
          # 'macos-latest' is deliberately avoided: it can switch arch or OS
          # version under us; the labels above pin both down. mac_tag names
          # the DMG, mac_min is the deployment target, mac_arch the binary
          # arch the verify step enforces.
          - os: macos-15-intel
            platform: macos-intel
            mac_arch: x86_64
            mac_min: "10.15"
            mac_tag: intel
          - os: macos-15
            platform: macos-arm64
            mac_arch: arm64
            mac_min: "11.0"
            mac_tag: arm64
          - os: ubuntu-latest
            platform: linux

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow
        pip install -r requirements.txt

    - name: Derive version from tag
      shell: bash
      run: |
        if [[ "$GITHUB_REF_NAME" == v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="0.0.0-dev.$(date +%Y%m%d%H%M%S)"
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "Building version $VERSION"

    - name: Stamp version into version.py
      shell: bash
      run: |
        sed -i.bak "s/^VERSION = .*/VERSION = \"${{ env.VERSION }}\"/" version.py
        rm -f version.py.bak
        python -c "import version; assert version.VERSION == '${{ env.VERSION }}', version.VERSION"

    - name: Generate Windows icon from logo
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python - <<'PY'
        from PIL import Image
        img = Image.open("assets/logo.png").convert("RGBA")
        img.save("assets/logo.ico", sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
        print("Generated assets/logo.ico")
        PY

    # The compiled help is authored once (help/html) and shipped everywhere:
    # a .chm for Windows and the same pages as the browser fallback elsewhere.
    - name: Compile help (WeatherSnake.chm)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install html-help-workshop -y --no-progress
        $env:PATH = "C:\Program Files (x86)\HTML Help Workshop;$env:PATH"
        python build_chm.py --compile
        if (-not (Test-Path "help/html/WeatherSnake.chm")) { throw "WeatherSnake.chm was not produced" }
        Write-Host "CHM compiled: $((Get-Item 'help/html/WeatherSnake.chm').Length) bytes"

    - name: Build GUI & CLI executables (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        pyinstaller --onefile --clean --noconsole --icon assets/logo.ico --name WeatherSnake --add-data "assets;assets" --add-data "help/html/WeatherSnake.chm;." --add-data "help/html;help/html" ui_app.pyw
        pyinstaller --onefile --clean --icon assets/logo.ico --name WeatherSnake-CLI --add-data "assets;assets" --add-data "help/html/WeatherSnake.chm;." --add-data "help/html;help/html" weather_juice.py

    - name: Build CLI executable (macOS/Linux)
      if: runner.os != 'Windows'
      shell: bash
      env:
        # Only read by the Apple toolchain (ignored on Linux): keeps any
        # extension code compiled from source compatible with the target's
        # minimum macOS (10.15 Intel, 11.0 Apple silicon).
        MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && matrix.mac_min || '' }}
      run: |
        pyinstaller --onefile --clean --name WeatherSnake-CLI --add-data "assets:assets" --add-data "help/html:help/html" weather_juice.py

    - name: Build GUI app bundle (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        # Minimum supported macOS for this build (10.15 Catalina on Intel,
        # 11.0 on Apple silicon): the Apple toolchain and PyInstaller embed
        # this as the binaries' minimum OS version. The bundled python.org
        # Python and the numpy/pandas/matplotlib wheels installed from PyPI
        # support both targets on their respective architectures.
        MACOSX_DEPLOYMENT_TARGET: ${{ matrix.mac_min }}
      run: |
        # --windowed without --onefile produces the .app bundle macOS users
        # expect; --target-architecture pins the bundle to the build's arch.
        pyinstaller --clean --windowed --target-architecture ${{ matrix.mac_arch }} --name WeatherSnake --add-data "assets:assets" --add-data "help/html:help/html" ui_app.pyw

    - name: Build GUI executable (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        pyinstaller --onefile --clean --windowed --name WeatherSnake --add-data "assets:assets" --add-data "help/html:help/html" ui_app.pyw

    # ----- Windows packaging: Inno Setup installer + portable zip -----
    # Runs in pwsh: Git Bash mangles ISCC's /O switch and $(pwd) into a POSIX
    # path the Windows-native compiler cannot parse ("Unknown option: //O...").
    - name: Build Windows installer (Inno Setup)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $candidates = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
          "${env:ProgramW6432}\Inno Setup 6\ISCC.exe"
        )
        $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) { throw "ISCC.exe not found - Inno Setup 6 is missing on the runner" }
        $outDir = Join-Path (Get-Location).Path "packaging\installer"
        & $iscc "/DAppVersion=$env:VERSION" "/O$outDir" "packaging\installers.iss"
        if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
        Get-ChildItem $outDir
        Move-Item -Force (Join-Path $outDir "WeatherSnake-*.exe") dist\
        if (-not (Test-Path "dist\WeatherSnake-$env:VERSION-windows-setup.exe")) { throw "Windows installer missing after ISCC build" }
        Write-Host "Installer built: dist\WeatherSnake-$env:VERSION-windows-setup.exe"

    - name: Zip portable binaries (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: Compress-Archive -Path dist/WeatherSnake.exe, dist/WeatherSnake-CLI.exe -DestinationPath dist/WeatherSnake-${{ env.VERSION }}-windows-x64-portable.zip -Force

    # Guard the per-arch targets: each macOS build's executables must match
    # its matrix architecture (an arm64-only app cannot launch on Catalina
    # Intel Macs, and an x86_64 build is not native on Apple silicon — the
    # exact failure mode seen when the macOS job ran on the Apple Silicon
    # 'macos-latest' runner). If a runner label is ever changed, the build
    # fails here instead of shipping a DMG for the wrong Macs.
    - name: Verify macOS binaries target macOS ${{ matrix.mac_min }}+
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        for bin in dist/WeatherSnake.app/Contents/MacOS/WeatherSnake dist/WeatherSnake-CLI; do
          echo "== $bin =="
          lipo -archs "$bin"
          lipo -archs "$bin" | grep -qw "${{ matrix.mac_arch }}" || {
            echo "::error::$bin is not ${{ matrix.mac_arch }} - the ${{ matrix.mac_tag }} DMG requires ${{ matrix.mac_arch }} binaries"
            exit 1
          }
          # Informational: the minimum macOS version the binary declares.
          otool -l "$bin" | grep -A 4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
        done
        echo "LSMinimumSystemVersion: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/WeatherSnake.app/Contents/Info.plist 2>/dev/null || echo '(not set)')"

    # ----- macOS packaging: .app bundle + drag-to-Install .dmg -----
    - name: Package macOS dmg
      if: runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p dmg-stage
        cp -R dist/WeatherSnake.app dmg-stage/
        cp dist/WeatherSnake-CLI dmg-stage/WeatherSnake-CLI
        cp -R help/html dmg-stage/help
        ln -s /Applications dmg-stage/Applications
        hdiutil create -volname "WeatherSnake ${{ env.VERSION }}" -srcfolder dmg-stage -ov -format UDZO \
          "dist/WeatherSnake-${{ env.VERSION }}-macos-${{ matrix.mac_tag }}.dmg"
        zip -qry "dist/WeatherSnake-${{ env.VERSION }}-macos-${{ matrix.mac_tag }}-app.zip" dist/WeatherSnake.app

    # ----- Linux packaging: .deb + portable tarball -----
    - name: Package Linux deb
      if: runner.os == 'Linux'
      shell: bash
      run: |
        VERSION="${{ env.VERSION }}"
        PKGROOT=deb/weathersnake
        mkdir -p "$PKGROOT/DEBIAN" \
                 "$PKGROOT/usr/bin" \
                 "$PKGROOT/usr/share/applications" \
                 "$PKGROOT/usr/share/icons/hicolor/256x256/apps" \
                 "$PKGROOT/usr/share/doc/weathersnake/help"

        install -m 755 dist/WeatherSnake       "$PKGROOT/usr/bin/weathersnake"
        install -m 755 dist/WeatherSnake-CLI   "$PKGROOT/usr/bin/weathersnake-cli"
        python - <<'PY'
        from PIL import Image
        img = Image.open("assets/logo.png").convert("RGBA")
        img.thumbnail((256, 256))
        img.save("deb/weathersnake/usr/share/icons/hicolor/256x256/apps/weathersnake.png")
        PY

        cat > "$PKGROOT/usr/share/applications/weathersnake.desktop" <<'DESKTOP'
        [Desktop Entry]
        Type=Application
        Name=WeatherSnake
        GenericName=Historical Weather Analyzer
        Comment=Explore historical weather patterns, conditions, and trends
        Exec=/usr/bin/weathersnake
        Icon=weathersnake
        Terminal=false
        Categories=Science;Education;Utility;
        Keywords=weather;climate;history;rain;temperature;
        DESKTOP

        cat > "$PKGROOT/DEBIAN/control" <<CONTROL
        Package: weathersnake
        Version: ${VERSION}
        Section: science
        Priority: optional
        Architecture: amd64
        Maintainer: WeatherSnake Contributors <noreply@github.com>
        Installed-Size: $(du -sk "$PKGROOT/usr" | cut -f1)
        Description: Historical weather analyzer with conditions, extremes, and trends
         WeatherSnake turns decades of daily weather into practical insight:
         multi-year averages, most-common conditions, typical ranges and
         extremes, year-over-year trends, and recent-vs-baseline comparisons.
         Data by the Open-Meteo Archive API (no API key required).
        CONTROL

        cp README.md "$PKGROOT/usr/share/doc/weathersnake/"
        cp LICENSE  "$PKGROOT/usr/share/doc/weathersnake/"
        cp -R help/html/. "$PKGROOT/usr/share/doc/weathersnake/help/"

        dpkg-deb --build --root-owner-group "$PKGROOT" "dist/weathersnake_${VERSION}_amd64.deb"
        tar -czf "dist/WeatherSnake-${VERSION}-linux-x64-portable.tar.gz" -C dist WeatherSnake WeatherSnake-CLI

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.platform }}
        path: |
          dist/*.exe
          dist/*.zip
          dist/*.dmg
          dist/*.deb
          dist/*.tar.gz
          dist/*.app.zip
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write  # required by cosign keyless signing (Sigstore OIDC)
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist-all
        merge-multiple: true

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Generate SHA256SUMS manifest
      run: |
        cd dist-all
        sha256sum WeatherSnake-* weathersnake_* > SHA256SUMS.txt

    # Keyless signing: each artifact is signed with the workflow's ephemeral
    # OIDC identity; signature (.sig) and certificate (.pem) are published
    # next to the binaries on the release.
    - name: Sign release artifacts
      env:
        COSIGN_YES: "true"
      run: |
        cd dist-all
        for f in $(awk '{print $2}' SHA256SUMS.txt) SHA256SUMS.txt; do
          echo "Signing $f"
          cosign sign-blob \
            --output-signature "${f}.sig" \
            --output-certificate "${f}.pem" \
            "$f"
        done

    # Self-check: prove the signatures verify against this workflow's
    # identity before publishing them.
    - name: Verify signatures
      run: |
        cd dist-all
        for f in $(awk '{print $2}' SHA256SUMS.txt) SHA256SUMS.txt; do
          echo "Verifying $f"
          cosign verify-blob \
            --certificate "${f}.pem" \
            --signature "${f}.sig" \
            --certificate-identity-regexp '^https://github.com/deanable/WeatherSnake/\.github/workflows/build-release\.yml@refs/tags/v.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$f"
        done

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist-all/WeatherSnake-*
          dist-all/weathersnake_*
          dist-all/SHA256SUMS.txt
        generate_release_notes: true
        fail_on_unmatched_files: true
